[package]
name = "tpt-shatter-kek"
description = "Key-encryption-key tool for tpt-shatter: seals a node's keys under a KEK split 2-of-3 among custodians, and unseals them into a key directory at boot."
readme = "README.md"
repository.workspace = true
keywords = ["key-management", "shamir", "envelope-encryption", "custody"]
categories = ["cryptography", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[[bin]]
name = "tpt-shatter-kek"
path = "src/main.rs"

[dependencies]
chacha20poly1305 = "0.11.0"
rand = "0.10.3"
# Shamir secret sharing over GF(256). MIT. This is the maintained fork of sharks, which
# has RUSTSEC-2024-0398: its coefficients are drawn from 1..=255, which biases the shares.
blahaj = "0.6.0"
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }
zeroize = "1.9.1"
