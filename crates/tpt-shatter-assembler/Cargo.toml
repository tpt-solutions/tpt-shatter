[package]
name = "tpt-shatter-assembler"
description = "Ephemeral reconstruction of records from their fragments, deadline-bounded assembly, and online schema migration for tpt-shatter."
readme = "README.md"
repository.workspace = true
keywords = ["reconstruction", "schema-migration", "fragments", "sharding", "data-security"]
categories = ["cryptography", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }
tpt-shatter-vault-client = { version = "0.1.0", path = "../tpt-shatter-vault-client" }
zeroize = "1.9.1"

[dev-dependencies]
tpt-shatter-canary = { version = "0.1.0", path = "../tpt-shatter-canary" }
tpt-shatter-emitter = { version = "0.1.0", path = "../tpt-shatter-emitter" }
tpt-shatter-shredder = { version = "0.1.0", path = "../tpt-shatter-shredder" }
