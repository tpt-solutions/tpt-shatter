[package]
name = "tpt-shatter-vault-client"
description = "Client for tpt-shatter's isolated vaults: keyed fragment IDs, a per-vault router with circuit breakers, and encrypted file storage with retention."
readme = "README.md"
repository.workspace = true
keywords = ["vault", "encryption", "chacha20poly1305", "circuit-breaker", "fragment-storage"]
categories = ["cryptography", "filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
chacha20poly1305 = "0.11.0"
hmac = "0.13.0"
rand = "0.10.3"
sha2 = "0.11.0"
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }
zeroize = "1.9.1"
