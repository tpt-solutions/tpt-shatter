[package]
name = "tpt-shatter-canary"
description = "Canary (honeytoken) records for tpt-shatter, with epoch rotation, in-band access detection, and alarm response."
readme = "README.md"
repository.workspace = true
keywords = ["honeytoken", "canary", "intrusion-detection", "decoy-data", "alerting"]
categories = ["cryptography"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }
tpt-shatter-shredder = { version = "0.1.0", path = "../tpt-shatter-shredder" }
tpt-shatter-vault-client = { version = "0.1.0", path = "../tpt-shatter-vault-client" }
zeroize = "1.9.1"
