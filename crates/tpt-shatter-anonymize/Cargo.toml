[package]
name = "tpt-shatter-anonymize"
description = "Anonymization primitives for tpt-shatter: range bucketing, salted pseudonyms, Laplace noise, k-anonymity gate, and display masking."
readme = "README.md"
repository.workspace = true
keywords = ["anonymization", "pseudonymization", "k-anonymity", "differential-privacy", "privacy"]
categories = ["cryptography", "algorithms"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
rand = "0.10.3"
sha2 = "0.11.0"
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }

[dev-dependencies]
proptest = "1.11.0"
