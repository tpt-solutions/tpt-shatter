[package]
name = "tpt-shatter-shredder"
description = "Splits records into per-vault fragments with compensating rollback, GDPR erasure, and a background orphan reaper for tpt-shatter."
readme = "README.md"
repository.workspace = true
keywords = ["data-fragmentation", "gdpr-erasure", "sharding", "orphan-reaper", "data-security"]
categories = ["cryptography", "filesystem"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }
tpt-shatter-vault-client = { version = "0.1.0", path = "../tpt-shatter-vault-client" }
serde_json = "1"
zeroize = "1.9.1"
