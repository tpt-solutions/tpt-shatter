[package]
name = "tpt-shatter-node"
description = "The tpt-shatter node: wires the vaults, router, canaries, gateway, token issuer, and background work into one service."
readme = "README.md"
repository.workspace = true
keywords = ["data-security", "gateway", "token-issuer", "vault", "daemon"]
categories = ["network-programming", "web-programming::http-server", "command-line-utilities"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
bytes = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
rand = "0.10.3"
sha2 = "0.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json", "std"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "tls12"] }
tpt-shatter-assembler = { version = "0.1.0", path = "../tpt-shatter-assembler" }
tpt-shatter-canary = { version = "0.1.0", path = "../tpt-shatter-canary" }
tpt-shatter-emitter = { version = "0.1.0", path = "../tpt-shatter-emitter" }
tpt-shatter-common = { version = "0.1.0", path = "../tpt-shatter-common" }
tpt-shatter-gateway = { version = "0.1.0", path = "../tpt-shatter-gateway" }
tpt-shatter-shredder = { version = "0.1.0", path = "../tpt-shatter-shredder" }
tpt-shatter-vault-service = { version = "0.1.0", path = "../tpt-shatter-vault-service" }
tpt-shatter-token = { version = "0.1.0", path = "../tpt-shatter-token" }
tpt-shatter-vault-client = { version = "0.1.0", path = "../tpt-shatter-vault-client" }
