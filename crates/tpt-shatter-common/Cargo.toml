[package]
name = "tpt-shatter-common"
description = "Shared types, errors, schemas, audit chain, and zeroizing helpers for tpt-shatter, a fragmented data-security architecture."
readme = "README.md"
repository.workspace = true
keywords = ["data-security", "fragmentation", "zeroize", "audit-log", "privacy"]
categories = ["cryptography", "data-structures"]
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
# Nothing in this workspace is published to crates.io.
publish = false

[lints]
workspace = true

[dependencies]
hmac = "0.13.0"
serde = { version = "1", features = ["derive"] }
sha2 = "0.11.0"
serde_json = "1"
thiserror = "2"
zeroize = "1"
